services:
  sanitar:
    build: .
    image: sanitar:local
    ports:
      # localhost only by default; change to "8080:8080" to expose on the network
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    # The service needs no internet access. To cut it off completely, attach it
    # to an internal network. Note: Docker does not publish ports of containers
    # that are only on internal networks, so you'd reach it via a reverse proxy
    # on the same network instead of the port mapping above.
    # networks:
    #   - isolated

# networks:
#   isolated:
#     internal: true
